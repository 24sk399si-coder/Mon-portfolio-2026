   <main>
    <section class="contact-section">
        <div class="contact-header">
            <h2>Parlons ensemble</h2>
            <p>Basé à Lubumbashi, disponible partout en RDC.</p>
        </div>

        <div class="contact-grid">
            <div class="contact-card-info">
                <div class="info-item">
                    <span class="label">Email</span>
                    <a href="mailto:votre-email@exemple.com" class="value">votre-email@exemple.com</a>
                </div>
                <div class="info-item">
                    <span class="label">Téléphone</span>
                    <a href="tel:+243992248814" class="value">099 224 8814</a>
                </div>
                <div class="info-item">
                    <span class="label">Localisation</span>
                    <span class="value">Lubumbashi, RDC</span>
                </div>
            </div>

            <form action="#" method="post" class="contact-form-modern">
                <div class="input-wrapper">
                    <input type="text" name="name" placeholder="Nom complet" required>
                </div>
                <div class="input-wrapper">
                    <input type="email" name="email" placeholder="Adresse Email" required>
                </div>
                <div class="input-wrapper">
                    <textarea name="message" placeholder="Votre projet ou message..." rows="4" required></textarea>
                </div>
                <button type="submit" class="btn-ultra">
                    <span>Envoyer le message</span>
                </button>
            </form>
        </div>

        <div class="social-minimal">
            <a href="https://wa.me" class="social-link wa">WhatsApp</a>
            <a href="https://t.me" class="social-link tg">Telegram</a>
        </div>
    </section>
</main>
